name: Publish to npm

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const server = JSON.parse(readFileSync('server.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${pkg.version}` || server.version !== pkg.version) {
            throw new Error('Release tag, package.json version and server.json version must match');
          }
          NODE
      - name: Pack release
        run: |
          mkdir release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact
      - name: Upload release tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download release tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: release-artifact
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11.21.1
          npm --version
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
          const [major, minor, patch] = match ? match.slice(1).map(Number) : [];
          if (!match || major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error(`npm ${version} is below the required stable version 11.5.1`);
          }
          NODE
      - name: Verify tarball release
        working-directory: release-artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { lstatSync, mkdtempSync, readFileSync, readdirSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          const files = readdirSync('.');
          const tarballs = files.filter((file) => file.endsWith('.tgz'));
          if (files.length !== 1 || tarballs.length !== 1 || !lstatSync(tarballs[0]).isFile()) {
            throw new Error('Artifact must contain exactly one regular .tgz file');
          }
          const directory = mkdtempSync(join(tmpdir(), 'npm-release-'));
          try {
            execFileSync('tar', ['-xzf', resolve(tarballs[0]), '-C', directory, '--', 'package/package.json']);
            const manifest = join(directory, 'package/package.json');
            if (!lstatSync(manifest).isFile()) throw new Error('Tarball manifest must be a regular file');
            const pkg = JSON.parse(readFileSync(manifest, 'utf8'));
            if (pkg.name !== 'hellohop-mcp' || process.env.RELEASE_TAG !== `v${pkg.version}`) {
              throw new Error('Tarball name and version must match the release tag');
            }
          } finally {
            rmSync(directory, { recursive: true, force: true });
          }
          NODE
      - name: Publish
        working-directory: release-artifact
        run: npm publish ./*.tgz --provenance --access public
